[project]
name = "container-blocker-analysis-mcp-server"
version = "1.0.0"
description = "MCP server using Google ADK for analyzing containerization blockers in application code"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.8.0",
    "gitpython>=3.1.0",
    "reportlab>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["container_blocker_analysis"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["container_blocker_analysis"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
